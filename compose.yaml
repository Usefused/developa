services:
  server:
    image: ${DEVELOPA_IMAGE:-ghcr.io/usefused/developa:latest}
    build: .
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to the PostgreSQL URL using host postgres}
      HTTP_ADDR: :8080
      OTEL_SERVICE_NAME: developa
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      REPOSITORY_PATH: ${REPOSITORY_PATH:-}
      REPOSITORY_NAME: ${REPOSITORY_NAME:-}
      REPOSITORIES: ${REPOSITORIES:-}
      WORKSPACE_ROOTS: ${WORKSPACE_ROOTS:-}
      DEVELOPA_API_TOKEN: ${DEVELOPA_API_TOKEN:-}
      WATCH_INTERVAL: ${WATCH_INTERVAL:-2s}
      SCAN_TIMEOUT: ${SCAN_TIMEOUT:-30s}
      OLLAMA_URL: ${OLLAMA_URL:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
      OLLAMA_ANALYSIS_MODEL: ${OLLAMA_ANALYSIS_MODEL:-}
      OLLAMA_ANSWER_MODEL: ${OLLAMA_ANSWER_MODEL:-}
      OLLAMA_CLOUD: ${OLLAMA_CLOUD:-false}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      OLLAMA_TIMEOUT: ${OLLAMA_TIMEOUT:-60s}
      AI_TIMEOUT: ${AI_TIMEOUT:-120s}
      AI_INDEX_ENABLED: ${AI_INDEX_ENABLED:-true}
      AI_AUTO_FEATURES: ${AI_AUTO_FEATURES:-false}
      AI_POLL_INTERVAL: ${AI_POLL_INTERVAL:-2s}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3
    stop_grace_period: 20s
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-developa}
      POSTGRES_DB: ${POSTGRES_DB:-developa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a PostgreSQL password}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
